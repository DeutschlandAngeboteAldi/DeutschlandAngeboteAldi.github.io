<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aldi/Rewe/Edeka/Penny/Lidl Discounts</title>
    <style>
        body {
            --bg-color: var(--tg-theme-bg-color);
            font: 12px/18px "Lucida Grande", "Lucida Sans Unicode", Arial, Helvetica, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--tg-theme-text-color);
            margin: 48px 24px;
            padding: 0;
            color-scheme: var(--tg-color-scheme);
        }
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #aaa;
            padding: 8px 12px;
            text-align: left;
        }
        :root {
        /* Default for light scheme or fallback */
            --th-background: #f0f0f0;
        }

        /* Select the root element when the Telegram client has injected the dark scheme variable */
        :root[style*="--tg-color-scheme: dark"] {
            --th-background: #3a3a3a;
        }
        th {
            background: var(--th-background);
        }        
        .filters {
            width: 80%;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .filter-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }
        .filters input, .filters select {
            padding: 5px;
        }
        #filterPriceMin, #filterPriceMax {
            width: 8ch;
        }
        #filterDescription {
            width: 70%;
        }
        .filters label {
            display: flex;
            flex-direction: column;
        }

        /* new: ensure checkboxes are centered in their flex parents */
        .filters .filter-row input[type="checkbox"] {
            align-self: center;    /* center inside a flex container */
            margin-left: 6px;
            vertical-align: middle; /* fallback for non-flex contexts */
        }
    </style>
</head>
<body>
    <h2 id="pageTitle" style="text-align:center;">Shop discounts</h2>
    <div class="filters">
        <div class="filter-row">
            <label style="display:flex;align-items:center;gap:8px;">
                Shop:
                <select id="filterShop">
                    <option value="">All</option>
                    <option value="aldi">aldi</option>
                    <option value="edeka">edeka</option>
                    <option value="penny">penny</option>
                    <option value="rewe">rewe</option>
                </select>
            </label>
            <label style="display:flex;align-items:center;gap:8px;">
                Name:
                <input type="text" id="filterName" placeholder="Name">
                <label style="display:inline-flex;align-items:center;gap:6px;margin-left:6px;" >
                </label>
            </label>
            <label style="display:flex;align-items:center;gap:8px;">
                Fuzzy:
                <input style="display:inline-flex;align-items:center;gap:6px;margin-left:6px;" type="checkbox" id="filterFuzzy">
            </label>

            
        </div>
        <div class="filter-row">
            <label>Description: <input type="text" id="filterDescription" placeholder="Description"></label>
            <label>Price Min: <input type="number" id="filterPriceMin" min="0" step="0.01" placeholder="Min"></label>
            <label>Price Max: <input type="number" id="filterPriceMax" min="0" step="0.01" placeholder="Max"></label>
        </div>
    </div>
    <table id="discountTable">
        <thead>
            <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <script>
        let allData = [];

        // Simple fuzzy match: checks if all characters of pattern appear in order in text
        function fuzzyMatch(pattern, text) {
            pattern = pattern.toLowerCase();
            text = text.toLowerCase();
            let patternIdx = 0, textIdx = 0;
            while (patternIdx < pattern.length && textIdx < text.length) {
                if (pattern[patternIdx] === text[textIdx]) {
                    patternIdx++;
                }
                textIdx++;
            }
            return patternIdx === pattern.length;
        }

        function renderTable(data) {
            // Clear headers and body
            const headerRow = document.getElementById('tableHeader');
            headerRow.innerHTML = '';
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!Array.isArray(data) || data.length === 0) return;

            // Define the headers we want to display
            const headers = ['price', 'discount-percent', 'name', 'description', 'shop'];
            headers.forEach(h => {
                const th = document.createElement('th');
                th.textContent = h.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
                headerRow.appendChild(th);
            });

            // Create table rows
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.price}</td>
                    <td>${row.discount ? row.discount + '%' : ''}</td>
                    <td>${row.name}</td>
                    <td>${row.description}</td>
                    <td>${row.shop}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilters() {
            let filtered = allData.slice();

            const shopSelect = document.getElementById('filterShop');
            const shop = shopSelect.value.trim().toLowerCase();
            const name = document.getElementById('filterName').value.trim();
            const desc = document.getElementById('filterDescription').value.trim();
            const priceMin = parseFloat(document.getElementById('filterPriceMin').value);
            const priceMax = parseFloat(document.getElementById('filterPriceMax').value);
            const fuzzy = document.getElementById('filterFuzzy') ? document.getElementById('filterFuzzy').checked : true;

            // Update page title
            const pageTitle = document.getElementById('pageTitle');
            const selectedOption = shopSelect.options[shopSelect.selectedIndex];
            const shopName = selectedOption.text;
            pageTitle.textContent = `${shopName} Discounts`;

            // If all filters are empty, or only the shop filter is selected, show no data.
            const otherFiltersActive = name || desc || !isNaN(priceMin) || !isNaN(priceMax);
            if (!otherFiltersActive) {
                renderTable([]);
                return;
            }

            if ((name.length > 0 && name.length < 3) || (desc.length > 0 && desc.length < 3)) {
                renderTable([]);
                return;
            }

            filtered = filtered.filter(row => {
                // Shop filter
                if (shop && String(row.shop).toLowerCase() !== shop) return false;
                if (name.length >= 3) {
                    if (fuzzy) {
                        if (!fuzzyMatch(name, String(row.name))) return false;
                    } else {
                        if (String(row.name).toLowerCase().indexOf(name.toLowerCase()) === -1) return false;
                    }
                }
                if (desc.length >= 3 && !fuzzyMatch(desc, String(row.description))) return false;
                // Price min filter
                if (!isNaN(priceMin) && parseFloat(row.price) < priceMin) return false;
                // Price max filter
                if (!isNaN(priceMax) && parseFloat(row.price) > priceMax) return false;
                return true;
            });

            renderTable(filtered.slice(0, 20));
        }

        fetch('data.csv')
            .then(response => response.text())
            .then(text => {
                const lines = text.trim().split('\n');
                const data = lines.map(line => {
                    if (!line) return null;
                    const [discount, price, name, description, shop] = line.split('⥌');
                    return {
                        price: parseFloat(price),
                        discount: discount ? parseInt(discount, 10) : null,
                        name: name,
                        description: description,
                        shop: shop
                    };
                }).filter(Boolean); // remove any null entries from empty lines

                allData = data;
                applyFilters(); // Initially call filters to ensure table is empty
            })
            .catch(err => {
                console.error('Error fetching or parsing data:', err);
                document.getElementById('discountTable').outerHTML = "<p style='color:red;text-align:center;'>Failed to load data</p>";
            });

        // Add event listeners for filters
        document.addEventListener('DOMContentLoaded', () => {
            applyFilters(); // Set initial title
            renderTable([]); // Ensure table is empty on load
            ['filterShop', 'filterName', 'filterDescription', 'filterPriceMin', 'filterPriceMax', 'filterFuzzy'].forEach(id => {
                document.getElementById(id).addEventListener('input', applyFilters);
            });
        });
    </script>

 <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Init TWA
        Telegram.WebApp.ready();

        // Event occurs whenever theme settings are changed in the user's Telegram app (including switching to night mode).
        Telegram.WebApp.onEvent('themeChanged', function() {
            document.documentElement.className = Telegram.WebApp.colorScheme;
        });
            
    </script>
    
</body>
</html>
